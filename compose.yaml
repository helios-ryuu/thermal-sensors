name: thermal-monitoring

services:
  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    image: thermal-collector:latest
    container_name: thermal-collector
    environment:
      COLLECTOR_INTERVAL: ${COLLECTOR_INTERVAL:-10}
      TEXTFILE_OUTPUT_PATH: /textfile/thermal_sensors.prom
      MBPFAN_CONFIG_PATH: /etc/mbpfan.conf
    volumes:
      - /sys:/sys:ro
      - ${MBPFAN_CONF_PATH:-/etc/mbpfan.conf}:/etc/mbpfan.conf:ro
      - ${SENS_DATA_DIR:-./data}/textfile:/textfile
    networks:
      - monitoring
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: thermal-node-exporter
    command:
      - --collector.disable-defaults
      - --collector.textfile
      - --collector.textfile.directory=/textfile
    volumes:
      - ${SENS_DATA_DIR:-./data}/textfile:/textfile:ro
    networks:
      - monitoring
    read_only: true
    security_opt:
      - no-new-privileges=true
    depends_on:
      - collector
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: thermal-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
    ports:
      - "${PROMETHEUS_BIND_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${SENS_DATA_DIR:-./data}/prometheus:/prometheus
    networks:
      - monitoring
    depends_on:
      - node-exporter
    security_opt:
      - no-new-privileges=true
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: thermal-grafana
    ports:
      - "${GRAFANA_BIND_IP:-100.120.64.5}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ${SENS_DATA_DIR:-./data}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges=true
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?TUNNEL_TOKEN is required}
    networks:
      - monitoring
    depends_on:
      - grafana

networks:
  monitoring:
    name: thermal-monitoring
