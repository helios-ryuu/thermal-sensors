name: thermal-monitoring

services:
  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    image: thermal-collector:latest
    container_name: thermal-collector
    environment:
      COLLECTOR_INTERVAL: ${COLLECTOR_INTERVAL:-10}
      TEXTFILE_OUTPUT_PATH: /textfile/thermal_sensors.prom
      MBPFAN_CONFIG_PATH: /etc/mbpfan.conf
    volumes:
      - /sys:/sys:ro
      - ${MBPFAN_CONF_PATH:-/etc/mbpfan.conf}:/etc/mbpfan.conf:ro
      - ${SENS_DATA_DIR:-./data}/textfile:/textfile
    networks:
      - monitoring
    restart: unless-stopped

  net-collector:
    build:
      context: ./net-collector
      dockerfile: Dockerfile
    image: thermal-net-collector:latest
    container_name: thermal-net-collector
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
      - /proc:/host/proc:ro
      - /etc/resolv.conf:/etc/resolv.conf:ro
      - ${SENS_DATA_DIR:-./data}/textfile:/textfile
    environment:
      METRICS_OUTPUT_PATH: /textfile/network_metrics.prom
      COLLECTOR_FAST_INTERVAL: ${NET_COLLECTOR_FAST_INTERVAL:-15}
      COLLECTOR_SLOW_INTERVAL: ${NET_COLLECTOR_SLOW_INTERVAL:-120}
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: thermal-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.textfile.directory=/textfile
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - ${SENS_DATA_DIR:-./data}/textfile:/textfile:ro
    networks:
      - monitoring
    security_opt:
      - no-new-privileges=true
    depends_on:
      - collector
      - net-collector
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: thermal-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
    ports:
      - "${PROMETHEUS_BIND_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${SENS_DATA_DIR:-./data}/prometheus:/prometheus
    networks:
      - monitoring
    depends_on:
      - node-exporter
    security_opt:
      - no-new-privileges=true
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: thermal-grafana
    ports:
      - "${GRAFANA_BIND_IP:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ${SENS_DATA_DIR:-./data}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges=true
    restart: unless-stopped

networks:
  monitoring:
    name: thermal-monitoring
