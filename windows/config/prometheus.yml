# Cấu hình Prometheus Portable cho Windows
global:
  scrape_interval: 5s       # Tần số quét cao 5s làm 'Hộp đen' ghi nhận trước thời khắc sập nguồn
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: windows-unified-agent
    static_configs:
      - targets:
          - 127.0.0.1:9100

